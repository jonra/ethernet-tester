[project]
name = "ethtester"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pillow"]

[project.optional-dependencies]
dev = ["pytest"]
mcp = ["mcp==1.30.0", "uvicorn>=0.30"]

[project.scripts]
ethtester-cli = "ethtester.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
