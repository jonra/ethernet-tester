[project]
name = "ethtester"
version = "0.1.0"
description = "Raspberry Pi Zero Ethernet port tester with an e-ink display, an MCP server and a CLI"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jon Rasmussen" }]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["pillow"]

[project.optional-dependencies]
dev = ["pytest"]
mcp = ["mcp==1.30.0", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/jonra/ethernet-tester"

[project.scripts]
ethtester-cli = "ethtester.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
